databases:
  - name: invoiceops-db
    plan: free
    databaseName: invoiceops
    user: invoiceops

services:
  - type: web
    name: invoiceops-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoiceops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: "/app/uploads"
      - key: USE_BEDROCK
        value: "false"
      - key: SECRET_KEY
        generateValue: true
